version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: evanevan
      MYSQL_DATABASE: a2db
      MYSQL_USER: app
      MYSQL_PASSWORD: evanevan
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: webApiObituary/Dockerfile
    ports:
      - "7001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=db;Port=3306;Database=a2db;Uid=app;Pwd=evanevan
    depends_on:
      db:
        condition: service_healthy

# Notes:
# - Use this compose file for local development and CI integration tests.
# - Do NOT use the DB service from this compose for production. Use a managed DB (Azure DB for MySQL/Postgres).