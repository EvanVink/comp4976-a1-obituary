name: Deploy Backend API to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image to GHCR
      - name: Build and push API image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: webApiObituary/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner,, }}/assignment1:${{ github.sha }}
            ghcr.io/${{ github.repository_owner,, }}/assignment1:latest

      - name: Write image tag file
        run: echo "ghcr.io/${{ github.repository_owner,, }}/assignment1:${{ github.sha }}" > image-tag.txt

      - name: Upload image info
        uses: actions/upload-artifact@v4
        with:
          name: image-info
          path: image-tag.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image info
        uses: actions/download-artifact@v4
        with:
          name: image-info

      - name: Read image tag
        id: loadtag
        run: echo "image=$(cat image-tag.txt)" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_04CF83ADE24D49AAA02DD04DD6904315 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A71EBE6F1834FAC9E4544D57D7C8E2B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_31BBAA75CC9E45ECBB31D2B4C2B60876 }}

      - name: Deploy container image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'obituary-backend-api'
          images: ${{ steps.loadtag.outputs.image }}